#VRML_SIM R2023b utf8

PROTO URM37 [
  field SFVec3f    translation     0.071 -0.001 0.14
  field SFString   name            "URM37"
  field SFFloat    aperture        0.52
  field SFInt32    numberOfRays    10
  field SFFloat    resolution      0.001
  field SFString   type            "sonar"
  field MFVec3f    lookupTable     [
    0.004 200 0.01,
    0.1   500 0.01,
    0.2   500 0.01,
    0.25 1250 0.01,
    0.5  2500 0.01,
    0.75 3750 0.01,
    1    5000 0.01
  ]
field SFColor color 0.8 0.4 0.3
]
{
  DistanceSensor {
    translation IS translation
    name IS name
    type IS type
    aperture IS aperture
    numberOfRays IS numberOfRays
    resolution IS resolution
    lookupTable IS lookupTable

    children [
      Shape {
        appearance PBRAppearance {
          baseColor IS color
          roughness 1
          metalness 0
        }
        geometry Mesh {
          url [
            "../mesh/Capteur_US.dae"
          ]
        }
      }
    ]
  }
}
